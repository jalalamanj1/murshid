name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout source (private repo)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the app (vite + integrity)
        run: npm run build

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Verify release assets exist
        shell: pwsh
        run: |
          if (Test-Path "release") {
            Get-ChildItem "release" -Recurse | Select-Object Name, Length
          } else {
            Write-Host "No release directory found"
          }
